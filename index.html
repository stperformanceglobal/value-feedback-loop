/* ============================================================
   ST PERFORMANCE GLOBAL brand layer. Same tokens as Performance 360.
   ============================================================ */
:root {
  --st-gold:        #E7B530;
  --st-gold-hi:     #EAC148;
  --st-bronze:      #A8791A;
  --st-navy:        #182C4D;
  --st-deep:        #0C1524;
  --st-paper:       #F4F2ED;
  --st-paper-panel: #EAE6DD;
  --st-ink:         #2C3138;
  --st-ink-head:    #16233B;
  --st-hairline:    rgba(24,44,77,0.16);

  --st-display: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  --st-body:    "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;

  --brand:       var(--st-navy);
  --brand-chrome: var(--st-deep);
  --brand-light: #20365C;
  --brand-panel: var(--st-paper-panel);
  --accent:      var(--st-bronze);

  --ink:       var(--st-ink);
  --ink-head:  var(--st-ink-head);
  --ink-soft:  #5A616B;
  --ink-mute:  #7C838D;

  --line:      var(--st-hairline);
  --line-soft: #EDEAE3;
  --bg:        var(--st-paper);
  --card:      #FFFFFF;
  --pill-bg:   #F0EDE6;
  --pill-hover:#E6E2D9;

  --warn:  #8A6314; --warn-bg:  #F7EFDD; --warn-line:  #E0CB9B;
  --alert: #9B3A2E;

  --shadow:      0 1px 2px rgba(12,21,36,0.05), 0 4px 14px rgba(12,21,36,0.05);
  --shadow-lift: 0 4px 12px rgba(24,44,77,0.10), 0 12px 28px rgba(24,44,77,0.08);

  color-scheme: only light;
}
html { color-scheme: only light; background: var(--bg); }
/* Locked against OS dark mode and in-app webview auto-darkening. */
@media (prefers-color-scheme: dark) {
  :root, html { color-scheme: only light; }
  html, body { background: var(--bg) !important; color: var(--ink) !important; }
  .card, textarea, .field input { background: #FFFFFF !important; color: var(--ink) !important; }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); font-family: var(--st-body); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--st-display); font-weight: 700; letter-spacing: -0.022em; line-height: 1.08; color: var(--ink-head); }
.eyebrow { font-family: var(--st-body); font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); font-size: 11px; margin-bottom: 8px; }

/* LOCKUP: the mark is gold artwork so it always sits on the deep ground. */
.st-lockup { display: flex; align-items: center; gap: 11px; flex-shrink: 0; }
.st-lockup .peak { height: 28px; width: auto; display: block; flex-shrink: 0; }
.st-lockup .word { font-family: var(--st-body); font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #FFFFFF; line-height: 1; white-space: nowrap; }

.st-chevron {
  height: 6px;
  background: linear-gradient(90deg,
    var(--st-deep) 0%, var(--st-deep) 34%,
    var(--st-gold) 34%, var(--st-gold) 40%,
    var(--st-deep) 40%, var(--st-deep) 100%);
  opacity: 0.9;
}

.topbar { background: var(--brand-chrome); color: #fff; padding: 13px 28px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.topbar .brand { font-size: 13px; color: rgba(255,255,255,0.75); }

.shell { width: 100%; max-width: min(880px, 94%); margin: 0 auto; padding: clamp(18px, 3vw, 36px) clamp(14px, 2vw, 28px) 90px; }

.stage-bar { display: flex; gap: 6px; margin-bottom: 22px; }
.stage-bar .pip { flex: 1; height: 4px; background: var(--line-soft); border-radius: 2px; }
.stage-bar .pip.done { background: var(--brand); }
.stage-bar .pip.active { background: var(--accent); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: clamp(20px, 3vw, 36px); box-shadow: var(--shadow); }
h1 { font-size: clamp(24px, 4vw, 30px); margin: 0 0 12px; }
h2 { font-size: 18px; margin: 22px 0 8px; }
p { margin: 0 0 14px; color: var(--ink-soft); }
.muted { color: var(--ink-mute); font-size: 13px; }

.covenant { background: var(--brand-panel); border-left: 4px solid var(--brand); border-radius: 0 8px 8px 0; padding: 16px 18px; margin: 16px 0 20px; font-size: 13.5px; line-height: 1.65; color: var(--ink); }
.covenant .lead { display: block; font-weight: 700; color: var(--ink-head); margin-bottom: 4px; }
.covenant p { color: var(--ink); font-size: 13.5px; margin: 0 0 8px; }
.covenant p:last-child { margin-bottom: 0; }

.field { margin-bottom: 22px; }
.field label, .field .label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.field .hint { font-size: 12.5px; color: var(--ink-mute); margin-bottom: 10px; line-height: 1.55; }

.q-block { margin-bottom: 26px; padding-bottom: 22px; border-bottom: 1px solid var(--line-soft); }
.q-block:last-of-type { border-bottom: none; padding-bottom: 0; }
.q-title { font-size: 15.5px; font-weight: 700; color: var(--ink-head); margin-bottom: 4px; font-family: var(--st-display); }
.q-title .opt { font-family: var(--st-body); font-weight: 500; color: var(--ink-mute); font-size: 12px; margin-left: 4px; }
.q-frame { font-size: 12.5px; color: var(--ink-mute); font-style: italic; margin-bottom: 10px; line-height: 1.55; }
.q-block.evidence { background: #FBFAF7; border: 1px dashed var(--line); border-radius: 10px; padding: 16px 16px 18px; margin-top: -6px; }
.q-block.evidence .q-title::before { content: "\2192\00a0"; color: var(--accent); }

textarea { display: block; width: 100%; font-family: inherit; font-size: 15px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); line-height: 1.65; min-height: 130px; overflow: hidden; resize: none; }
.q-block.evidence textarea { min-height: 96px; }
textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(24,44,77,0.10); }
.print-mirror { display: none; white-space: pre-wrap; }

.scale-block { margin-top: 14px; padding: 14px 16px; background: var(--line-soft); border-radius: 8px; }
.scale-prompt { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.scale-prompt .opt { font-weight: 500; color: var(--ink-mute); font-size: 12px; margin-left: 6px; }
.scale-pills { display: flex; gap: 6px; }
.scale-pill { font-family: inherit; font-size: 14px; font-weight: 700; min-width: 44px; min-height: 44px; color: var(--ink-soft); background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.scale-pill:hover { background: var(--pill-bg); }
.scale-pill.selected { background: var(--brand); color: #fff; border-color: var(--brand); }
.scale-anchors { font-size: 11.5px; color: var(--ink-mute); margin-top: 8px; }

.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink-soft); background: var(--pill-bg); border: 1px solid var(--line); padding: 10px 16px; border-radius: 100px; cursor: pointer; min-height: 44px; }
.pill:hover { background: var(--pill-hover); }
.pill.selected { background: var(--brand); color: #fff; border-color: var(--brand); }
.pill .tick { display: none; margin-right: 6px; color: var(--st-gold-hi); }
.pill.selected .tick { display: inline; }
.role-card { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.role-opt { text-align: left; font-family: inherit; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px; cursor: pointer; }
.role-opt:hover { border-color: #B9B2A2; }
.role-opt .t { display: block; font-family: var(--st-display); font-weight: 700; font-size: 17px; color: var(--ink-head); margin-bottom: 4px; }
.role-opt .d { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.role-opt.selected { border-color: var(--brand); background: #F3F5F9; box-shadow: inset 0 0 0 1px var(--brand); }
.role-opt.selected .t::after { content: "  \2713"; color: var(--accent); }

.nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 26px; }
.btn { font-family: inherit; font-size: 15px; font-weight: 600; padding: 12px 22px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; min-height: 46px; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-light); }
.btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
.btn-ghost:hover { background: var(--pill-bg); }
.btn-small { font-size: 13px; padding: 8px 14px; min-height: 0; }
.btn-big { font-size: 16px; padding: 15px 30px; }
.error-msg { color: var(--alert); font-size: 13px; margin-top: 10px; font-weight: 600; }

.review-meta { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 14px; margin: 16px 0 6px; padding: 16px 18px; background: var(--brand-panel); border-radius: 8px; }
.review-meta b { color: var(--ink-head); font-weight: 600; }
.review-section-head { font-family: var(--st-body); font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 30px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.review-section-head .score { float: right; letter-spacing: 0.04em; text-transform: none; color: var(--ink-head); font-weight: 700; }
.edit-note { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn); border-radius: 8px; padding: 12px 15px; font-size: 13px; margin-bottom: 20px; }
.print-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 28px; }
.score-line { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
.score-line b { color: var(--ink-head); }
.tools-line { font-size: 14px; color: var(--ink); margin: 0 0 16px; }

.autosave { position: fixed; bottom: 16px; right: 16px; background: var(--brand); color: #fff; font-size: 12px; padding: 8px 14px; border-radius: 20px; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: var(--shadow-lift); }
.autosave.show { opacity: 0.95; }

.resume-banner { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; font-size: 13px; color: var(--warn); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.resume-banner button { background: var(--warn); color: #fff; border: none; padding: 7px 13px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; font-family: inherit; }
.resume-banner button.ghost { background: transparent; color: var(--warn); border: 1px solid var(--warn); margin-left: 6px; }

/* PRINT: A4 with 20mm margins. Only the review content and the data page print. */
@page { size: A4; margin: 20mm; }
.print-only { display: none; }
.print-head { border-bottom: 2px solid var(--brand); padding-bottom: 12px; margin-bottom: 18px; }
.print-head .st-lockup { background: var(--st-deep); padding: 9px 14px; border-radius: 7px; display: inline-flex; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.print-head h2 { margin: 14px 0 2px; font-size: 20px; }
.print-head .meta { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
.print-foot { margin-top: 22px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--ink-mute); }
.data-page { break-before: page; page-break-before: always; }
.data-page .label { font-size: 9pt; color: var(--ink-mute); margin-bottom: 8px; }
.data-page .blob { font-family: "Courier New", Courier, monospace; font-size: 6.5pt; line-height: 1.25; color: #6B717A; word-break: break-all; overflow-wrap: anywhere; white-space: normal; }

@media print {
  html, body { background: #fff !important; }
  .topbar, .st-chevron, .stage-bar, .autosave, .resume-banner, .no-print,
  .edit-note, .print-row, .nav-row, .scale-block { display: none !important; }
  .print-only { display: block !important; }
  .shell { max-width: 100% !important; width: 100% !important; padding: 0 !important; }
  .card { border: none !important; box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; }
  textarea { display: none !important; }
  .print-mirror { display: block !important; font-size: 11pt; line-height: 1.55; color: var(--ink); padding: 2px 0 0; }
  .review-meta { background: none !important; padding: 0 !important; border: none !important; }
  .q-block { break-inside: avoid; page-break-inside: avoid; border-bottom: none; padding-bottom: 8px; margin-bottom: 14px; }
  .q-block.evidence { background: none !important; border: none !important; border-left: 2px solid var(--line) !important; border-radius: 0 !important; padding: 0 0 0 12px !important; margin-top: 0 !important; }
  .review-section-head { break-after: avoid; page-break-after: avoid; }
  h1 { font-size: 18pt; }
}

@media (max-width: 640px) {
  .topbar { padding: 12px 16px; }
  .topbar .brand { display: none; }
  .st-lockup .peak { height: 24px; }
  .st-lockup .word { font-size: 12px; letter-spacing: 0.10em; }
  .shell { padding-left: 14px; padding-right: 14px; }
  h1 { font-size: 23px; }
  textarea { font-size: 16px; }
  .nav-row .btn { flex: 1; }
  .role-card { grid-template-columns: 1fr; }
  .review-meta { grid-template-columns: 1fr; gap: 2px 0; }
  .review-meta b { margin-top: 8px; }
  .scale-pills { justify-content: space-between; }
  .scale-pill { flex: 1; }
}
</style>
</head>

<script>
//==============================================================================
// CONFIG. Everything an owner changes on handover lives here.
//==============================================================================
const BRAND = {
  org:      'ST Performance Global',
  orgLabel: 'ST PERFORMANCE GLOBAL',
  app:      'Staff Feedback Loop',
  psgFirst: 'Simon',
  psgEmail: 'simon@stperformanceglobal.com',
};

// Same 1 to 5 scale as the 360 and the weekly pulse.
const SCALE_MAX = 5;
const SCALE_VALUE = {
  prompt: 'How much value has this added for you?',
  anchors: '1 very little &middot; 3 some &middot; 5 a great deal',
};
const SCALE_GROWTH = {
  prompt: 'How much has ST Performance contributed to your growth?',
  anchors: '1 very little &middot; 3 some &middot; 5 a great deal',
};

const ROLES = [
  { id: 'practitioner', label: 'Practitioner', desc: 'Most of the support has been about my own practice and how I work with athletes or clients.' },
  { id: 'leader',       label: 'Leader',       desc: 'Most of the support has been about how I lead people, a team or a department.' },
];

const TOOLS = [
  { id: 'baseline',   label: 'Individual Baseline' },
  { id: 'checkpoint', label: 'Checkpoint Evaluation' },
  { id: '360',        label: '360 Feedback' },
  { id: 'platform',   label: 'Performance Platform' },
  { id: 'other',      label: 'Something else' },
];

//==============================================================================
// QUESTIONS. One definition drives the stage pages, the review page, the print
// and the data page, so they cannot drift apart. The dashboard reads the same
// ids, so change both together.
//==============================================================================
const SECTIONS = [
  {
    id: 'process', label: 'The process', heading: 'The process',
    intro: 'How the support is set up and run. The rhythm, the structure and how it fits around your work.',
    items: [
      { key: 'value', score: 'process', scale: SCALE_VALUE,
        title: 'What about the process has worked for you?',
        frame: 'Think about how often things happen, how they are set up and how easy it is to take part.',
        placeholder: 'What has worked and why.' },
      { key: 'evidence', evidence: true,
        title: 'A specific example or piece of evidence',
        frame: 'A moment, a decision or a change in what you do. Something concrete that shows the value or the lack of it.',
        placeholder: 'Optional. The more specific the better.' },
      { key: 'more',
        title: 'What would make the process work better for you?',
        frame: 'Timing, format, frequency or anything else about how it runs.',
        placeholder: 'What would you change?' },
    ],
  },
  {
    id: 'tools', label: 'The tools', heading: 'The tools', hasTools: true,
    intro: 'The tools you have used along the way. Pick the ones you have used first so your answers can be read against them.',
    items: [
      { key: 'value', score: 'tools', scale: SCALE_VALUE,
        title: 'What have the tools given you?',
        frame: 'What did filling them in or reading them back show you? Did they help you see something you would not have seen otherwise?',
        placeholder: 'What the tools have added.' },
      { key: 'evidence', evidence: true,
        title: 'A specific example or piece of evidence',
        frame: 'A result that surprised you or a change you made because of something a tool showed you.',
        placeholder: 'Optional. The more specific the better.' },
      { key: 'more',
        title: 'What would make the tools more useful?',
        frame: 'Anything confusing, too long, missing or not worth the time.',
        placeholder: 'What would you change?' },
    ],
  },
  {
    id: 'insights', label: 'The insights', heading: 'The insights',
    intro: 'What you have learned about yourself and your work through the support. The reads, the patterns and the things that were pointed out to you.',
    items: [
      { key: 'value', score: 'insights', scale: SCALE_VALUE,
        title: 'Which insights have been most valuable?',
        frame: 'Something you understand now that you did not before. About your practice, your leadership or yourself.',
        placeholder: 'The insights that stuck.' },
      { key: 'evidence', evidence: true,
        title: 'A specific example or piece of evidence',
        frame: 'Where did an insight show up in your work afterwards?',
        placeholder: 'Optional. The more specific the better.' },
      { key: 'more',
        title: 'Where could the insights go further?',
        frame: 'Areas that were missed, too general or did not land.',
        placeholder: 'What is still missing?' },
    ],
  },
  {
    id: 'conversations', label: 'The conversations', heading: 'The conversations',
    intro: 'The time spent with the Performance Support Guide. How those conversations feel and what they lead to.',
    items: [
      { key: 'value', score: 'conversations', scale: SCALE_VALUE,
        title: 'What has made the conversations valuable?',
        frame: 'The questions asked, the challenge, the listening or the follow through.',
        placeholder: 'What has worked in the conversations.' },
      { key: 'evidence', evidence: true,
        title: 'A specific example or piece of evidence',
        frame: 'A conversation that shifted something for you and what changed after it.',
        placeholder: 'Optional. The more specific the better.' },
      { key: 'more',
        title: 'What would make the conversations more valuable?',
        frame: 'More challenge or less, a different focus or a different rhythm. Be direct. This is exactly what the loop is for.',
        placeholder: 'What would you change?' },
    ],
  },
  {
    id: 'overall', label: 'Your growth', heading: 'Your growth overall',
    intro: 'Stepping back from the parts. What has the support done for your growth as a practitioner or leader and as a person?',
    items: [
      { key: 'value', score: 'overall', scale: SCALE_GROWTH,
        title: 'How have you grown through this support?',
        frame: 'Your practice, your leadership, how you think or how you look after yourself. Whatever has moved.',
        placeholder: 'How you have grown.' },
      { key: 'evidence', evidence: true,
        title: 'Evidence of that growth',
        frame: 'Something you now do differently or something others have noticed. Concrete is better than general.',
        placeholder: 'Optional. The more specific the better.' },
      { key: 'more',
        title: 'Anything else for the Performance Support Guide or ST Performance?',
        frame: 'What to keep, what to stop or anything that did not fit elsewhere.',
        placeholder: 'Optional. Anything else.' },
    ],
  },
];

const STAGES = ['welcome', 'about'].concat(SECTIONS.map(s => s.id)).concat(['review']);
const STEPS = STAGES.length - 1;   // welcome is not a numbered step

//==============================================================================
// STATE
//==============================================================================
const STORAGE_KEY = 'st_feedback_loop_draft_v1';
function blankAnswers() {
  const a = {};
  SECTIONS.forEach(s => { a[s.id] = {}; s.items.forEach(it => { a[s.id][it.key] = ''; }); });
  return a;
}
function blankScores() {
  const o = {};
  SECTIONS.forEach(s => s.items.forEach(it => { if (it.score) o[it.score] = null; }));
  return o;
}
function newId() { return 'fl-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
const state = {
  stage: 0,
  responseId: newId(),
  role: '',
  tools: [],
  answers: blankAnswers(),
  scores: blankScores(),
};
if (typeof window !== 'undefined') window.state = state;

//==============================================================================
// HELPERS
//==============================================================================
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function today() {
  return new Date().toLocaleDateString('en-NZ', { day: 'numeric', month: 'long', year: 'numeric' });
}
function roleLabel() { return (ROLES.find(r => r.id === state.role) || {}).label || 'Not given'; }
function toolsLabel() {
  if (!state.tools.length) return 'None selected';
  return TOOLS.filter(t => state.tools.includes(t.id)).map(t => t.label).join(', ');
}
function hasAnyAnswer() {
  return SECTIONS.some(s => s.items.some(it => (state.answers[s.id][it.key] || '').trim()))
      || Object.values(state.scores).some(v => v != null);
}

//==============================================================================
// PERSISTENCE. A draft in this browser only. Nothing is uploaded; the finished
// feedback leaves as a printed PDF.
//==============================================================================
function saveDraft() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); showAutosave(); } catch (e) {}
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.responseId) state.responseId = d.responseId;
    if (typeof d.stage === 'number') state.stage = Math.min(d.stage, STAGES.length - 1);
    if (typeof d.role === 'string') state.role = d.role;
    if (Array.isArray(d.tools)) state.tools = d.tools;
    if (d.answers) SECTIONS.forEach(s => { if (d.answers[s.id]) Object.assign(state.answers[s.id], d.answers[s.id]); });
    if (d.scores) Object.keys(state.scores).forEach(k => { if (d.scores[k] !== undefined) state.scores[k] = d.scores[k]; });
    return state.stage > 0 && (hasAnyAnswer() || !!state.role);
  } catch (e) { return false; }
}
function clearDraft() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
let autosaveTimer = null;
function showAutosave() {
  const el = document.getElementById('autosave');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

//==============================================================================
// FIELDS
//==============================================================================
function autogrow(el) { if (!el) return; el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function growAll() { document.querySelectorAll('textarea').forEach(autogrow); }

function onAnswer(el, sectionId, key) {
  state.answers[sectionId][key] = el.value;
  autogrow(el);
  // Print reads from a mirror element, never the textarea, so long answers
  // are not clipped on the page.
  const mirror = el.parentElement.querySelector('.print-mirror');
  if (mirror) mirror.textContent = el.value || 'Not answered.';
  refreshDataPage();
  saveDraft();
}

function renderScale(scoreKey, scale) {
  const current = state.scores[scoreKey];
  const pills = Array.from({ length: SCALE_MAX }, (_, i) => i + 1).map(v => `
    <button type="button" class="scale-pill ${current === v ? 'selected' : ''}"
      data-key="${scoreKey}" data-val="${v}" onclick="setScore('${scoreKey}', ${v})"
      role="radio" aria-checked="${current === v}">${v}</button>`).join('');
  return `
    <div class="scale-block no-print">
      <div class="scale-prompt">${escapeHtml(scale.prompt)}<span class="opt">(optional)</span></div>
      <div class="scale-pills" role="radiogroup" aria-label="${escapeHtml(scale.prompt)}">${pills}</div>
      <div class="scale-anchors">${scale.anchors}</div>
    </div>`;
}
function setScore(key, val) {
  state.scores[key] = (state.scores[key] === val) ? null : val;
  document.querySelectorAll(`.scale-pill[data-key="${key}"]`).forEach(p => {
    const on = Number(p.dataset.val) === state.scores[key];
    p.classList.toggle('selected', on);
    p.setAttribute('aria-checked', on);
  });
  document.querySelectorAll(`[data-score-line="${key}"]`).forEach(el => { el.innerHTML = scoreLineHtml(key); });
  refreshDataPage();
  saveDraft();
}
function scoreLineHtml(key) {
  const v = state.scores[key];
  return v == null ? 'Not scored.' : `Rated <b>${v} of ${SCALE_MAX}</b>.`;
}

function renderQuestion(section, item, opts) {
  const value = state.answers[section.id][item.key] || '';
  const id = `q-${section.id}-${item.key}`;
  const optional = item.evidence ? '<span class="opt no-print">(optional)</span>' : '';
  return `
    <div class="q-block ${item.evidence ? 'evidence' : ''}">
      <div class="q-title">${escapeHtml(item.title)}${optional}</div>
      ${opts.showFrame ? `<div class="q-frame no-print">${escapeHtml(item.frame)}</div>` : ''}
      <textarea id="${id}" placeholder="${escapeHtml(item.placeholder || '')}"
        oninput="onAnswer(this, '${section.id}', '${item.key}')">${escapeHtml(value)}</textarea>
      <div class="print-mirror">${escapeHtml(value) || 'Not answered.'}</div>
      ${item.score ? renderScale(item.score, item.scale) : ''}
      ${item.score ? `<div class="score-line print-only" data-score-line="${item.score}">${scoreLineHtml(item.score)}</div>` : ''}
    </div>`;
}

//==============================================================================
// STAGES
//==============================================================================
function renderWelcome() {
  return `
    <div class="card">
      <div class="eyebrow">${escapeHtml(BRAND.orgLabel)} &middot; Staff Feedback Loop</div>
      <h1>How is the support working for you?</h1>
      <p>This is your chance to say what the support has actually done for you. It covers
      the process, the tools, the insights and the conversations. The aim is simple. Keep

      <div class="covenant">
        <span class="lead">How this works</span>
        <p>There is no name or department to fill in. You answer a handful of questions and
        can skip any of them. At the end every answer sits on one page where you can edit it
        before you print it as a PDF and send it to ${escapeHtml(BRAND.psgFirst)}.</p>
        <p>It is read by the Performance Support Guide and used to shape the support. It is
        never used to assess you.</p>
      </div>

      <div class="covenant">
        <span class="lead">Names are welcome where they help</span>
        <p>This is anonymous by design, but if naming someone gives an example its context
        you are free to do it. That includes your own name. One thing to know: if you email
        the PDF yourself your address will show who sent it.</p>
      </div>

      <p class="muted">About 10 minutes. There is no set time to do this so come back to it
      whenever reflecting would be useful. Your draft saves in this browser and you can close
      the tab and return.</p>

      <div class="nav-row">
        <span class="muted" style="font-size:12px;">Specific examples are the most useful thing you can give.</span>
        <button class="btn btn-primary" onclick="goNext()">Begin</button>
      </div>
    </div>`;
}

function renderAbout() {
  return `
    <div class="card">
      <div class="eyebrow">Step 1 of ${STEPS} &middot; About you</div>
      <h1>Which best describes you?</h1>
      <p>Optional. It helps read your answers in the right context. Many leaders are also
      practitioners so pick the one closest to the support you have had.</p>

      <div class="field">
        <div class="role-card" role="radiogroup" aria-label="Practitioner or leader">
          ${ROLES.map(r => `
            <button type="button" class="role-opt ${state.role === r.id ? 'selected' : ''}"
              role="radio" aria-checked="${state.role === r.id}" onclick="setRole('${r.id}')">
              <span class="t">${escapeHtml(r.label)}</span>
              <span class="d">${escapeHtml(r.desc)}</span>
            </button>`).join('')}
        </div>
      </div>

      <p class="muted">That is the only thing asked about you. Whether you are supported as part
      of an organisation or on your own the questions are the same.</p>

      <div class="nav-row">
        <button class="btn btn-ghost" onclick="goPrev()">Back</button>
        <button class="btn btn-primary" onclick="goNext()">Continue</button>
      </div>
    </div>`;
}
function setRole(id) { state.role = state.role === id ? '' : id; saveDraft(); render(); }
function toggleTool(id) {
  state.tools = state.tools.includes(id) ? state.tools.filter(t => t !== id) : state.tools.concat(id);
  saveDraft();
  document.querySelectorAll('.pill[data-tool]').forEach(p => {
    const on = state.tools.includes(p.dataset.tool);
    p.classList.toggle('selected', on);
    p.setAttribute('aria-pressed', on);
  });
}

function renderToolPicker() {
  return `
    <div class="field">
      <div class="label">Which tools have you used?</div>
      <div class="hint">Pick any that apply.</div>
      <div class="pill-row">
        ${TOOLS.map(t => `
          <button type="button" class="pill ${state.tools.includes(t.id) ? 'selected' : ''}" data-tool="${t.id}"
            aria-pressed="${state.tools.includes(t.id)}" onclick="toggleTool('${t.id}')"><span class="tick">&#10003;</span>${escapeHtml(t.label)}</button>`).join('')}
      </div>
    </div>`;
}

function renderSection(section) {
  const step = STAGES.indexOf(section.id);
  return `
    <div class="card">
      <div class="eyebrow">Step ${step} of ${STEPS} &middot; ${escapeHtml(section.label)}</div>
      <h1>${escapeHtml(section.heading)}</h1>
      <p>${escapeHtml(section.intro)} Every question is optional.</p>
      ${section.hasTools ? renderToolPicker() : ''}
      ${section.items.map(it => renderQuestion(section, it, { showFrame: true })).join('')}
      <div class="nav-row">
        <button class="btn btn-ghost" onclick="goPrev()">Back</button>
        <button class="btn btn-primary" onclick="goNext()">Continue</button>
      </div>
    </div>`;
}

//==============================================================================
// DATA PAGE. The last printed page carries the answers as an encoded block so
// the Feedback Loop dashboard can read the PDF back in. People never need to
// read it.
//==============================================================================
// The person's own calendar date, not UTC, so evening feedback keeps its day.
function localDate() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function payload() {
  return {
    kind: 'feedback-loop',
    schema: 1,
    responseId: state.responseId,
    submittedAt: localDate(),
    role: state.role || null,
    tools: state.tools.slice(),
    answers: JSON.parse(JSON.stringify(state.answers)),
    scores: Object.assign({}, state.scores),
  };
}
function encodePayload() {
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload()))));
}
function refreshDataPage() {
  const el = document.getElementById('data-blob');
  if (el) el.textContent = '---BEGIN-FEEDBACK-LOOP-DATA---' + encodePayload() + '---END-FEEDBACK-LOOP-DATA---';
}

function onPrint() {
  const err = document.getElementById('review-err');
  if (!hasAnyAnswer()) {
    err.textContent = 'There is nothing to print yet. Answer at least one question first.';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  refreshDataPage();
  window.print();
}
function startAnother() {
  if (!confirm('Clear this feedback and start a fresh one? Make sure you have saved the PDF first.')) return;
  clearDraft();
  location.reload();
}

//==============================================================================
// NAVIGATION
//==============================================================================
function goNext() { if (state.stage < STAGES.length - 1) { state.stage++; render(); toTop(); saveDraft(); } }
function goPrev() { if (state.stage > 0) { state.stage--; render(); toTop(); saveDraft(); } }
function jumpTo(key) { state.stage = STAGES.indexOf(key); render(); toTop(); saveDraft(); }
// Scroll the window explicitly. Body is never made the scroll container.
function toTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

function renderStageBar() {
  const pips = [];
  for (let i = 1; i <= STEPS; i++) {
    pips.push(`<div class="pip ${i < state.stage ? 'done' : (i === state.stage ? 'active' : '')}"></div>`);
  }
  document.getElementById('stage-bar').innerHTML = state.stage === 0 ? '' : pips.join('');
}

function render() {
  const key = STAGES[state.stage];
  let html = '';
  if (key === 'welcome') html = renderWelcome();
  else if (key === 'about') html = renderAbout();
  else if (key === 'review') html = renderReview();
  else html = renderSection(SECTIONS.find(s => s.id === key));
  document.getElementById('root').innerHTML = html;
  renderStageBar();
  growAll();
  refreshDataPage();
}

window.addEventListener('beforeprint', refreshDataPage);

//==============================================================================
// INIT
//==============================================================================
(function init() {
  const hadDraft = loadDraft();
  if (hadDraft) {
    const banner = document.createElement('div');
    banner.className = 'resume-banner';
    banner.innerHTML = `
      <span>Welcome back. There is a draft in progress. Pick up where you left off?</span>
      <div>
        <button onclick="this.closest('.resume-banner').remove();">Resume</button>
        <button class="ghost" onclick="if(confirm('Discard the saved draft and start over?')){clearDraft();location.reload();}">Start over</button>
      </div>`;
    document.querySelector('.shell').insertBefore(banner, document.getElementById('stage-bar'));
  }
  render();
})();
</script>
